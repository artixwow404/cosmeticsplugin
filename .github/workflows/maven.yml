name: Build Cosmetics Plugin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Build with Maven
      run: mvn -B clean package --file pom.xml
    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: Cosmetics-1.0.0
        path: target/Cosmetics-1.0.0.jar
